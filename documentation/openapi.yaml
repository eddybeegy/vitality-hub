openapi: 3.0.3
info:
  title: Vitality Hub API
  version: 1.0.0
  description: OpenAPI-compatible description of the Vitality Hub REST API for tooling
    and client generation.
servers:
- url: http://192.168.1.67:3000
  description: Local development server
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
    AuthLoginRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    AuthLoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type:
          - string
          - 'null'
        display_mode:
          type:
          - string
          - 'null'
        approved:
          type: boolean
        role:
          type: string
    ModuleConfig:
      type: object
      properties:
        id:
          type: string
        enabled:
          type: boolean
        userSettings:
          type: object
    MetricsAggregatedResponse:
      type: array
      items:
        type: object
    AIInsight:
      type: object
      properties:
        type:
          type: string
        content:
          type: string
        date:
          type: string
        provider:
          type: string
        model:
          type: string
        batch_id:
          type: string
        updated_at:
          type: string
          format: date-time
    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
        date:
          type: string
        batch_id:
          type: string
    Target:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
        value:
          type: number
        unit:
          type: string
    TargetListResponse:
      type: array
      items:
        $ref: '#/components/schemas/Target'
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        approved:
          type: boolean
        role:
          type: string
        show_debug_logs:
          type: boolean
        enable_daily_briefing:
          type: boolean
    AdminConfigMap:
      type: object
      additionalProperties:
        type: string
    MetricAggregationItem:
      type: object
      properties:
        date:
          type: string
          format: date
        value:
          type: number
        type:
          type: string
        unit:
          type: string
    AIProviderInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        models:
          type: array
          items:
            type: string
        constraints:
          type: object
          additionalProperties: true
    AIModelListResponse:
      type: object
      properties:
        gemini:
          type: array
          items:
            type: string
    AIProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AIProviderInfo'
    AIGenerateRequest:
      type: object
      required:
      - prompt
      properties:
        prompt:
          type: string
        maxTokens:
          type: integer
        model:
          type: string
        provider:
          type: string
    AIGenerateResponse:
      type: object
      properties:
        text:
          type: string
        provider:
          type: string
        model:
          type: string
    AICacheEntry:
      type: object
      properties:
        content:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
    WithingsAuthUrlResponse:
      type: object
      properties:
        url:
          type: string
    UserSettingsResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type:
          - string
          - 'null'
        display_mode:
          type:
          - string
          - 'null'
        approved:
          type: boolean
        role:
          type: string
        ai_configs:
          type: array
          items:
            type: object
    LogEntry:
      type: object
      properties:
        id:
          type: integer
        level:
          type: string
        message:
          type: string
        source:
          type: string
        timestamp:
          type: string
          format: date-time
    DebugMetricRow:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
        value:
          type: number
        unit:
          type: string
        timestamp:
          type: string
          format: date-time
        source:
          type: string
    Workout:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        timestamp:
          type: string
          format: date-time
        source:
          type: string
        name:
          type: string
        routine_folder:
          type:
          - string
          - 'null'
        external_id:
          type:
          - string
          - 'null'
        duration:
          type:
          - integer
          - 'null'
    WorkoutListResponse:
      type: array
      items:
        $ref: '#/components/schemas/Workout'
    MealItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        timestamp:
          type: string
          format: date-time
        source:
          type: string
        calories:
          type: number
security:
- cookieAuth: []
paths:
  /api/auth/login:
    post:
      summary: Login or register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      summary: Logout user
      security: []
      responses:
        '200':
          description: Logout success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/auth/me:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
  /api/settings:
    get:
      summary: Get settings for current user
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
    post:
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/targets:
    get:
      summary: Get user targets
      responses:
        '200':
          description: List of targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetListResponse'
    post:
      summary: Save user targets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      value:
                        type: number
                      unit:
                        type: string
      responses:
        '200':
          description: Targets saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/admin/config:
    get:
      summary: Get admin configuration
      responses:
        '200':
          description: Config object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfigMap'
    post:
      summary: Set admin configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
              required:
              - key
              - value
      responses:
        '200':
          description: Config saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/admin/users:
    get:
      summary: List users
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
  /api/admin/users/{id}/approve:
    post:
      summary: Approve a user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: User approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/admin/users/{id}/reject:
    post:
      summary: Reject a user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: User rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/admin/users/{id}/purge:
    post:
      summary: Purge selected data for a user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metrics:
                  type: boolean
                workouts:
                  type: boolean
                routines:
                  type: boolean
                insights:
                  type: boolean
                logs:
                  type: boolean
                chat:
                  type: boolean
      responses:
        '200':
          description: Purge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/admin/users/{id}/toggle-debug:
    post:
      summary: Toggle debug logging for a user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
              - enabled
      responses:
        '200':
          description: Toggle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API health status
          content:
            application/json:
              schema:
                type: object
  /api/data/refresh:
    post:
      summary: Refresh the summary cache for the current user
      responses:
        '200':
          description: Cache refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/metrics/aggregated:
    get:
      summary: Get aggregated metrics
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        schema:
          type: string
          format: date
      - name: granularity
        in: query
        required: true
        schema:
          type: string
          enum:
          - day
          - week
          - month
      - name: aggregation
        in: query
        schema:
          type: string
          enum:
          - sum
          - max
          - min
          - average
      responses:
        '200':
          description: Aggregated metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsAggregatedResponse'
  /api/data/summary:
    get:
      summary: Get summary dashboard data
      parameters:
      - name: startDate
        in: query
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Summary data object
          content:
            application/json:
              schema:
                type: object
  /api/modules:
    get:
      summary: List configured sync modules
      responses:
        '200':
          description: Module list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleConfig'
  /api/modules/{moduleId}/toggle:
    post:
      summary: Toggle a module
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
              - enabled
      responses:
        '200':
          description: Module toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/modules/{moduleId}/settings:
    post:
      summary: Update module settings
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
              required:
              - settings
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/sync/{moduleId}:
    post:
      summary: Start a data sync for a module
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Sync started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/sync/status:
    get:
      summary: Check whether sync is running
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isSyncing:
                    type: boolean
  /api/purge/{moduleId}:
    post:
      summary: Purge module data for current user
      parameters:
      - name: moduleId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Purge result
          content:
            application/json:
              schema:
                type: object
  /api/purge/apple-health-workouts:
    post:
      summary: Purge Apple Health workouts
      responses:
        '200':
          description: Purge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/meals/frequent:
    get:
      summary: Get frequent meals summary
      responses:
        '200':
          description: Frequent meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealItem'
  /api/routines/apply-progression:
    post:
      summary: Apply progressions to a routine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                routineId:
                  type: string
                progressions:
                  type: array
                  items:
                    type: object
              required:
              - routineId
              - progressions
      responses:
        '200':
          description: Progressions applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/ai/data:
    get:
      summary: Get AI training data
      responses:
        '200':
          description: AI training data
          content:
            application/json:
              schema:
                type: object
  /api/ai/models:
    get:
      summary: List available AI models
      responses:
        '200':
          description: AI models list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelListResponse'
  /api/ai/providers:
    get:
      summary: List AI providers and their models
      responses:
        '200':
          description: AI provider list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvidersResponse'
  /api/ai/fetch-models:
    post:
      summary: Fetch provider models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                providerId:
                  type: string
                apiKey:
                  type: string
                baseUrl:
                  type: string
              required:
              - providerId
      responses:
        '200':
          description: Fetched models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelListResponse'
  /api/ai/generate:
    post:
      summary: Generate AI text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                maxTokens:
                  type: integer
                model:
                  type: string
                provider:
                  type: string
              required:
              - prompt
      responses:
        '200':
          description: AI generation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIGenerateResponse'
  /api/ai/cache/{key}:
    get:
      summary: Read AI cache entry
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cache entry
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  content:
                    type: object
                    additionalProperties: true
                  updated_at:
                    type: string
                    format: date-time
    post:
      summary: Write AI cache entry
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: object
              required:
              - content
      responses:
        '200':
          description: Cache saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/ai/configs:
    post:
      summary: Save AI provider configs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                configs:
                  type: array
                  items:
                    type: object
                    properties:
                      provider:
                        type: string
                      api_key:
                        type: string
                      model:
                        type: string
                      base_url:
                        type: string
                    required:
                    - provider
              required:
              - configs
      responses:
        '200':
          description: Configs saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/ai/insights:
    get:
      summary: Get AI insights
      parameters:
      - name: force
        in: query
        schema:
          type: boolean
      - name: days
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: AI insights list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIInsight'
    post:
      summary: Save an AI insight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIInsight'
      responses:
        '200':
          description: Insight saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/ai-insights:
    post:
      summary: Save an AI insight alias endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIInsight'
      responses:
        '200':
          description: Insight saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/chat-history:
    get:
      summary: Get chat history
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
      - name: batch_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
    post:
      summary: Save chat history message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessage'
      responses:
        '200':
          description: Message saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /api/logs:
    get:
      summary: Get recent logs
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
    post:
      summary: Create a log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: string
                message:
                  type: string
                source:
                  type: string
              required:
              - level
              - message
              - source
      responses:
        '200':
          description: Log saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/debug/logs:
    get:
      summary: Get authenticated debug logs
      responses:
        '200':
          description: Debug logs list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/debug/metrics/{type}:
    get:
      summary: Get debug metrics by type
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Metric rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DebugMetricRow'
  /api/debug/metrics:
    get:
      summary: Get distinct metric types
      responses:
        '200':
          description: Metric types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/debug/last-metrics:
    get:
      summary: Get latest metric rows
      responses:
        '200':
          description: Latest metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DebugMetricRow'
  /api/debug/apple-health-last-sync:
    get:
      summary: Get last Apple Health sync metadata
      responses:
        '200':
          description: Sync metadata
          content:
            application/json:
              schema:
                type: object
  /api/debug/apple-health-full-body:
    get:
      summary: Get last full Apple Health body record
      responses:
        '200':
          description: Full body data or info
          content:
            application/json:
              schema:
                type:
                - object
                - string
  /api/debug/deduplicate:
    post:
      summary: Run workout deduplication
      responses:
        '200':
          description: Deduplication result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  removed:
                    type: integer
  /api/debug/workouts:
    get:
      summary: Get all workout rows
      responses:
        '200':
          description: Workout list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutListResponse'
  /api/auth/withings/url:
    get:
      summary: Get Withings OAuth authorization URL
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithingsAuthUrlResponse'
  /api/hevy/update-routine:
    post:
      summary: Update a Hevy routine with progressions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                routine_external_id:
                  type: string
